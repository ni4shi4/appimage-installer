[project]
name = "appimages"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "tomlkit>=0.14.0",
]

[project.scripts]
create-environment = "create_environment:main"
install-cursor = "app.cursor.main:main"
install-lm-studio = "app.lm_studio.main:main"
install-obsidian = "app.obsidian.main:main"

[dependency-groups]
dev = [
    "mypy>=1.16.1",
    "pre-commit>=4.2.0",
    "ruff>=0.12.3",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
